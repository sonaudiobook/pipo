<body>
  
	<div id="tmpLoading" style="width: 100%; height: 100%; position: absolute; z-index: -2;background:#323232;"></div>

	<!-- Caja con indicaciones y el botón de instalación -->
	<div id="install-container">
		<p id="android-text">Para instalar este cuento como una aplicación, dale clic en el botón de abajo:</p>
		<button id="btnInstallApp">instalar app android</button>
		<p class="ios-instructions">
			<strong>Si estás en un celular iOS (iPhone/iPad):</strong> Abre este menú en Safari, toca el botón de <b>Compartir</b> (el cuadrado con una flecha hacia arriba) y selecciona <b>"Agregar al inicio"</b>.
		</p>
	</div>

	<script type="text/javascript">var sendvisitinfo = function (type, page) { };</script>
	<script type="text/javascript">
		window.readerConfigLoaded = true;
	</script>
	
	<script src="javascript/pdf.js"></script>
	<script>
		try {
			if (pdfjsLib) {
				pdfjsLib.GlobalWorkerOptions.workerSrc = "javascript/pdf.worker.js";
			}
		} catch (error) {}
	</script>

	<!-- Script de registro de PWA adaptado para la ruta /pipo/ -->
	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('/pipo/sw.js')
					.then(reg => console.log('Service Worker registrado:', reg.scope))
					.catch(err => console.log('Error en Service Worker:', err));
			});
		}

		let deferredPrompt;
		const installContainer = document.getElementById('install-container');
		const btnInstallApp = document.getElementById('btnInstallApp');

		window.addEventListener('beforeinstallprompt', (e) => {
			e.preventDefault();
			deferredPrompt = e;
			installContainer.style.display = 'block';
		});

		btnInstallApp.addEventListener('click', async () => {
			if (deferredPrompt) {
				deferredPrompt.prompt();
				const { outcome } = await deferredPrompt.userChoice;
				if (outcome === 'accepted') {
					console.log('Usuario aceptó la instalación');
				}
				deferredPrompt = null;
				installContainer.style.display = 'none';
			}
		});

		window.addEventListener('DOMContentLoaded', () => {
			const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
			if (isIos) {
				document.getElementById('android-text').style.display = 'none';
				btnInstallApp.style.display = 'none';
				installContainer.style.display = 'block';
			} else {
				setTimeout(() => {
					if (installContainer.style.display !== 'block') {
						installContainer.style.display = 'block';
					}
				}, 3000);
			}
		});
	</script>
